name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agriculture/ams-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agriculture/ams-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static frontend
        run: npm run build
        env:
          GITHUB_ACTIONS: true
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: agriculture/ams-frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
